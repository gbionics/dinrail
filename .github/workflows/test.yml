name: Pixi Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Check clang-format consistency
        if: matrix.os == 'ubuntu-latest'
        run: pixi run format-check

      - name: Run test suite
        run: pixi run test

      - name: Build examples as standalone project
        run: pixi run --manifest-path examples/pixi.toml build
